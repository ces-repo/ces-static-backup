name: Prepare Failover Backup

on:
  push:
    branches:
      - gh-pages

jobs:
  prepare-backup:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Inject banner and modify buttons
        run: |
          # Banner HTML (minified)
          BANNER='<!-- Failover Banner --><style>.failover-banner{position:fixed;top:0;left:0;right:0;background:linear-gradient(135deg,#c62828 0%,#8e0000 100%);color:#fff;padding:14px 20px;text-align:center;z-index:999999;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:15px;font-weight:500;box-shadow:0 2px 10px rgba(0,0,0,.3)}.failover-banner a{color:#fff;text-decoration:underline}body{padding-top:52px!important}</style><div class="failover-banner">⚠️ Wartungsmodus – Bestellungen derzeit nicht möglich | 📞 <a href="tel:+41447307070">044 730 70 70</a> | ✉️ <a href="mailto:anfrage@catering-miete.ch">anfrage@catering-miete.ch</a></div><!-- /Failover Banner -->'
          
          # JavaScript für Button-Ersetzung
          SCRIPT='<!-- Failover Script --><script>document.addEventListener("DOMContentLoaded",function(){var btns=document.querySelectorAll(".add_to_cart_button,.single_add_to_cart_button,.ajax_add_to_cart,[class*=add-to-cart],button[name=add-to-cart]");btns.forEach(function(b){b.disabled=true;b.style.opacity="0.5";b.style.cursor="not-allowed";b.innerHTML="☎️ Telefonisch bestellen";b.onclick=function(e){e.preventDefault();e.stopPropagation();alert("Unser Shop ist gerade in Wartung.\\n\\nFür Bestellungen rufen Sie uns an:\\n📞 044 730 70 70\\n\\nOder per E-Mail:\\n✉️ anfrage@catering-miete.ch");return false}});var links=document.querySelectorAll("a[href*=/cart],a[href*=/warenkorb],a[href*=/checkout],a[href*=/kasse]");links.forEach(function(l){l.onclick=function(e){e.preventDefault();alert("Der Warenkorb ist während der Wartung nicht verfügbar.\\n\\n📞 044 730 70 70\\n✉️ anfrage@catering-miete.ch");return false}});var qty=document.querySelectorAll("input.qty,input[name=quantity]");qty.forEach(function(i){i.disabled=true})});</script><!-- /Failover Script -->'
          
          echo "Starting banner injection..."
          COUNT=0
          
          # Alle HTML-Dateien finden und bearbeiten
          for file in $(find . -name "*.html" -type f); do
            MODIFIED=false
            
            # Banner einfügen (falls nicht vorhanden)
            if ! grep -q "failover-banner" "$file" 2>/dev/null; then
              if grep -q "<body" "$file" 2>/dev/null; then
                sed -i 's/<body[^>]*>/&'"$BANNER"'/' "$file" && MODIFIED=true
              fi
            fi
            
            # Script einfügen (falls nicht vorhanden)
            if ! grep -q "Failover Script" "$file" 2>/dev/null; then
              if grep -q "</body>" "$file" 2>/dev/null; then
                sed -i 's|</body>|'"$SCRIPT"'</body>|' "$file" && MODIFIED=true
              fi
            fi
            
            if [ "$MODIFIED" = true ]; then
              COUNT=$((COUNT + 1))
              echo "✓ $file"
            fi
          done
          
          echo "---"
          echo "Modified $COUNT files"

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🛠️ Auto-inject failover banner + button blocking"
            git push
          fi
