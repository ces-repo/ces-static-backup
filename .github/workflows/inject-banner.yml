name: Prepare Failover Backup

on:
  push:
    branches:
      - gh-pages
  workflow_dispatch:

jobs:
  prepare-backup:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Inject banner and modify buttons
        run: |
          # Create banner file
          cat > /tmp/banner.html << 'BANNEREOF'
          <div id="failover-banner" style="position:fixed;top:0;left:0;right:0;background:#dc2626;color:white;padding:12px;text-align:center;z-index:99999;font-family:sans-serif;font-size:14px;">
            <strong>⚠️ Wartungsmodus</strong> – Online-Bestellung aktuell nicht möglich. 
            <a href="tel:+41447307070" style="color:white;text-decoration:underline;">☎️ +41 44 730 70 70</a> · 
            <a href="mailto:anfrage@catering-miete.ch" style="color:white;text-decoration:underline;">✉️ anfrage@catering-miete.ch</a>
          </div>
          <script>document.body.style.paddingTop="60px";</script>
          BANNEREOF

          # Create button-blocking script
          cat > /tmp/blockscript.html << 'SCRIPTEOF'
          <script>
          document.addEventListener('DOMContentLoaded',function(){
            document.querySelectorAll('.single_add_to_cart_button, .add_to_cart_button').forEach(function(b){
              b.outerHTML='<a href="tel:+41447307070" style="background:#059669;color:white;padding:12px 24px;border-radius:4px;text-decoration:none;display:inline-block;">☎️ Telefonisch bestellen</a>';
            });
            document.querySelectorAll('a[href*="cart"], a[href*="checkout"], a[href*="warenkorb"], a[href*="kasse"]').forEach(function(a){
              a.addEventListener('click',function(e){e.preventDefault();alert('Bestellung aktuell nur telefonisch: +41 44 730 70 70');});
            });
            document.querySelectorAll('input.qty, input[name="quantity"]').forEach(function(i){i.disabled=true;});
          });
          </script>
          SCRIPTEOF

          echo "Starting banner injection..."
          
          # Process all HTML files
          find . -name "*.html" -type f | while read file; do
            # Remove old banner if exists
            if grep -q "failover-banner\|wartungsmodus" "$file"; then
              echo "🔄 Replace existing banner: $file"
              sed -i '/<div id="failover-banner"/,/<\/div>/d; /<div id="wartungsmodus"/,/<\/div>/d' "$file"
            fi
            
            
            # Check if file has <body tag
            if grep -q "<body" "$file"; then
              # Create temp file
              cp "$file" "$file.tmp"
              
              # Insert banner after <body...>
              awk '
                /<body[^>]*>/ {
                  print
                  while ((getline line < "/tmp/banner.html") > 0) print line
                  close("/tmp/banner.html")
                  next
                }
                {print}
              ' "$file.tmp" > "$file.tmp2"
              
              # Insert script before </body>
              awk '
                /<\/body>/ {
                  while ((getline line < "/tmp/blockscript.html") > 0) print line
                  close("/tmp/blockscript.html")
                }
                {print}
              ' "$file.tmp2" > "$file"
              
              rm -f "$file.tmp" "$file.tmp2"
              echo "✓ $file"
            fi
          done
          
          echo "Banner injection complete!"

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git config --local http.postBuffer 524288000
          git add -A
          git diff --staged --quiet || git commit -m "🔧 Auto-inject failover banner + button blocking [skip ci]"
          git push --no-thin --force
